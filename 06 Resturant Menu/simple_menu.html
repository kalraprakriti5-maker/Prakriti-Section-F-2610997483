<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #fff7ed; }
        .item {
            display: inline-block;
            width: 150px;
            margin: 10px;
            padding: 20px;
            background: white;
            border: 2px solid orange;
            border-radius: 10px;
            text-decoration: none;
            color: black;
        }
        .item:hover { background: orange; color: white; }
        .emoji { font-size: 50px; }
    </style>
</head>
<body>
    <h1>Restaurant Menu</h1>
<a class="item" href="https://en.wikipedia.org/wiki/Pizza" target="_blank">
        <div class="emoji">🍕</div>
        <h3>Pizza</h3>
    </a>

    <a class="item" href="https://en.wikipedia.org/wiki/Hamburger" target="_blank">
        <div class="emoji">🍔</div>
        <h3>Burger</h3>
    </a>

    <a class="item" href="https://en.wikipedia.org/wiki/French_fries" target="_blank">
        <div class="emoji">🍟</div>
        <h3>French Fries</h3>
    </a>

    <a class="item" href="https://en.wikipedia.org/wiki/Sandwich" target="_blank">
        <div class="emoji">🥪</div>
        <h3>Sandwich</h3>
    </a>

    <a class="item" href="https://en.wikipedia.org/wiki/Cake" target="_blank">
        <div class="emoji">🍰</div>
        <h3>Cake</h3>
    </a>

    <a class="item" href="https://en.wikipedia.org/wiki/Menu" target="_blank">
        <div class="emoji">📋</div>
        <h3>Menu Card</h3>
    </a>
</body>
</html>
